<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6366f1">
  <title>Challenge Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1 class="brand"><span class="logo">🔥</span><span class="brand-text">Challenge Tracker</span></h1
      <p class="subtitle">Build streaks. Keep your promises.</p>
    </div>
  </header>

    <section>
      <h2>Quick start</h2>
      <div id="template-grid" class="template-grid"></div>
    </section>

  <main class="container">
    <section>
      <h2>My challenges</h2>
      <p id="status-message"></p>
      <ul id="challenge-list"></ul>
    </section>

    <section>
      <h2>New challenge</h2>
      <form id="challenge-form">
        <label>
          Name
          <input type="text" id="name" required maxlength="100" placeholder="30 days no sugar">
        </label>

        <label>
          Description (optional)
          <textarea id="description" rows="2"></textarea>
        </label>

        <label>
          Duration (days)
          <input type="number" id="duration" min="1" max="3650" value="30" required>
        </label>

        <label>
          Start date
          <input type="date" id="start-date" required>
        </label>

        <label class="checkbox">
          <input type="checkbox" id="strict" checked>
          Strict mode (a slip resets the streak)
        </label>

        <button type="submit">Create challenge</button>
        <p id="form-message"></p>
      </form>
    </section>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
