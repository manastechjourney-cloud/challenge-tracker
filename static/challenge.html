<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b1a">
  <title>Challenge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <div class="container">
      <a class="back-link" href="/">&larr; All challenges</a>
      <h1 id="challenge-name" class="page-title">Loading...</h1>
      <p id="challenge-info" class="subtitle"></p>
      <button type="button" id="edit-button" class="ghost">Edit</button>
    </div>
  </header>

  <main class="container">
    <p id="page-message"></p>

    <section>
      <h2>Progress</h2>
      <div class="hero">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
            <defs>
              <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#22d3ee"/>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52" stroke="url(#ring-grad)"/>
          </svg>
          <div class="ring-label"><span id="ring-percent">0%</span><small>complete</small></div>
        </div>
        <div class="flame-box">
          <div class="flame-slot"><div class="flame cold" id="flame">🔥</div></div>
          <div class="flame-number" id="stat-streak">0</div>
          <div class="label">day streak</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span class="number" id="stat-completed">0</span><span class="label">Days done</span></div>
        <div class="stat"><span class="number" id="stat-left">0</span><span class="label">Days left</span></div>
        <div class="stat"><span class="number" id="stat-slipped">0</span><span class="label">Slips</span></div>
      </div>
    </section>

    <section>
      <h2>Calendar</h2>
      <div class="calendar-scroll">
        <div id="calendar-grid" class="calendar-grid"></div>
      </div>
      <div class="legend">
        <span><i class="swatch done"></i>Done</span>
        <span><i class="swatch slipped"></i>Slipped</span>
        <span><i class="swatch missed"></i>Missed</span>
        <span><i class="swatch today"></i>Today</span>
      </div>
    </section>

    <section id="checkin-section">
      <h2>Check in</h2>
      <p id="today-status"></p>
      <label>
        Day
        <input type="date" id="checkin-date">
      </label>
      <label>
        Note (optional)
        <textarea id="note" rows="2" maxlength="500"></textarea>
      </label>
      <div class="buttons">
        <button type="button" id="done-button">Done</button>
        <button type="button" id="slipped-button" class="danger">Slipped</button>
      </div>
    </section>

    <section>
      <h2>History</h2>
      <ul id="history-list"></ul>
    </section>
  </main>

  <dialog id="edit-dialog">
    <form id="edit-form">
      <h2>Edit challenge</h2>
      <label>
        Name
        <input type="text" id="edit-name" required maxlength="100">
      </label>
      <label>
        Description
        <textarea id="edit-description" rows="2"></textarea>
      </label>
      <label>
        Duration (days)
        <input type="number" id="edit-duration" min="1" max="3650" required>
      </label>
      <label>
        Start date
        <input type="date" id="edit-start" required>
      </label>
      <label class="checkbox">
        <input type="checkbox" id="edit-strict">
        Strict mode (a slip resets the streak)
      </label>
      <p id="edit-message" class="form-error"></p>
      <div class="buttons">
        <button type="submit">Save changes</button>
        <button type="button" class="ghost" id="edit-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/challenge.js"></script>
</body>
</html>
